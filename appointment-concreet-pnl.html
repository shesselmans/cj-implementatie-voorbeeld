<script>
(function () {

  function getCookie(name) {
    var match = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : '';
  }

  var data = {
    orderId:   "{{boekingNummer}}",
    eventTime: new Date().toISOString(),
    amount:    3.00,
    currency:  "EUR",
    cjEvent:   getCookie('cje'),
    demo:      false
  };

  var xmlhttp = new XMLHttpRequest();

  xmlhttp.onload = function () {
    if (xmlhttp.status >= 200 && xmlhttp.status < 300) {
      console.log('CJ afspraak-conversie sent successfully', JSON.parse(xmlhttp.responseText));
    } else {
      console.log('Error sending CJ afspraak-conversie', xmlhttp.status, xmlhttp.responseText);
    }
  };

  var url = "https://appt.pearle.nl/appt-tracker/cj-appointment-conversion"; // TODO: vervang door productie-URL

  xmlhttp.open("POST", url);
  xmlhttp.setRequestHeader("Content-Type", "application/json");
  xmlhttp.send(JSON.stringify(data));

})();
</script>
