<script>
	(function(){

		var boekingNummer = "{{boekingNummer}}";
		var datumReservering = "{{datumReservering}}";
		var activityId = "{{activityId}}";

		var xmlhttp = new XMLHttpRequest();
		xmlhttp.onload = function(ev){
			if (xmlhttp.status >= 200 && xmlhttp.status < 300) {
				var response = JSON.parse(xmlhttp.responseText);
                console.log('APPT API post was sent correctly - New Appointment');
				console.log(response);
			} else {
				var response = JSON.parse(xmlhttp.responseText);
				console.log('Error sending APPT API post - New Appointment');
				console.log(response);
			}
		}
		var url = "https://appt.pearle.nl/appt-tracker/appointment";
		xmlhttp.withCredentials = true;
		xmlhttp.open("POST", url);
		xmlhttp.setRequestHeader("Content-Type", "application/json");
		if(typeof boekingNummer !== "undefined" && typeof datumReservering !== "undefined" && typeof activityId !== "undefined"){
			var data = {
				"status":"SCHEDULED",
				"reflexId": boekingNummer,
				"apptType": activityId,
				"scheduledDate": datumReservering
			}
			xmlhttp.send(JSON.stringify(data));
		}
	})()
</script>
